name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Kept out of committed source deliberately (public repo) — see
      # _prd/BUILD-PLAN.md -> Decisions. Injected here from a repo secret
      # so the deployed site still has a real backend URL to call.
      - name: Write config.local.js from secret
        run: |
          cat > frontend/config.local.js <<EOF
          window.STORAGE_BASE_CONFIG = {
            backendUrl: '${{ secrets.BACKEND_URL }}'
          };
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
